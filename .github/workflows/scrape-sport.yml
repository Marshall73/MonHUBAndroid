name: Mise à jour Programme TV Sport

on:
  schedule:
    - cron: '17,37 8 * * *'
      timezone: 'Europe/Paris'
    - cron: '17,37 13 * * *'
      timezone: 'Europe/Paris'
    - cron: '32,52 17 * * *'
      timezone: 'Europe/Paris'
    - cron: '17,37 20 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

concurrency:
  group: sport-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  scrape-sport:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier si le créneau a déjà réussi
        id: freshness
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-scrape-freshness.sh scrape-sport.yml

      - name: Installer Node.js
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright Chromium
        if: steps.freshness.outputs.skip != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Aspirer le programme TV Sport
        if: steps.freshness.outputs.skip != 'true'
        run: node scripts/scrape-sport.js

      - name: Sauvegarder le JSON dans le dépôt
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "Hub Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sport.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sport tv schedule" && git push)
