name: Mise à jour Programme TV Sport

on:
  schedule:
    - cron: '30 6 * * *' # Tous les jours à 7h30 heure française
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-sport:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Aspirer le programme TV Sport
        run: node scripts/scrape-sport.js

      - name: Sauvegarder le JSON dans le dépôt
        run: |
          git config user.name "Hub Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sport.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sport tv schedule" && git push)