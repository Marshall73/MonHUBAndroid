name: Mise à jour Scores Sport

on:
  schedule:
    - cron: '0 15 * * *' # 16h00 (fin des matchs de l'après-midi)
    - cron: '0 18 * * *' # 19h00 (fin des matchs de 17h)
    - cron: '15 21 * * *' # 22h15 (fin des matchs de 20h15/20h30)
    - cron: '15 22 * * *' # 23h15 (fin des matchs de 21h)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Récupérer les scores via API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/scrape-scores.js

      - name: Sauvegarder scores.json dans le dépôt
        run: |
          git config user.name "Hub Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/scores.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update football scores" && git push)